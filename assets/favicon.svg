<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="50%" stop-color="#FFE5EA"/>
      <stop offset="100%" stop-color="#FCE1E7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EED58E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4ACB7"/>
      <stop offset="50%" stop-color="#E05780"/>
      <stop offset="100%" stop-color="#B32B54"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E05780" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle / Circle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Inner Fine-line Concentric Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#F4ACB7" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Botanical Rose Petal Flourish at Top Right -->
  <path d="M88 28 C92 20, 102 24, 100 32 C98 38, 90 38, 88 28 Z" fill="url(#roseGrad)" opacity="0.9"/>
  <path d="M85 31 C82 24, 74 25, 78 33 C80 37, 85 36, 85 31 Z" fill="#D4AF37" opacity="0.8"/>

  <!-- Iconic Monogram "R" in Pure Vector Curves -->
  <!-- Stem -->
  <path d="M42 34 L54 34 L54 88 L42 88 L42 94 L66 94 L66 88 L54 88 L54 64 L65 64 L77 89 L80 94 L93 94 L93 90 L84 72 C91 69, 96 61, 96 50 C96 38, 86 34, 70 34 L42 34 Z M54 40 L68 40 C78 40, 84 43, 84 50 C84 58, 77 60, 67 60 L54 60 Z" fill="#2B2123"/>

  <!-- Monogram Rose Accent Inlay -->
  <path d="M54 40 L68 40 C78 40, 84 43, 84 50 C84 58, 77 60, 67 60 L54 60 Z" fill="url(#roseGrad)" opacity="0.25"/>

  <!-- Sparkle Accent Star -->
  <path d="M30 46 Q34 46 34 42 Q34 46 38 46 Q34 46 34 50 Q34 46 30 46 Z" fill="url(#goldGrad)"/>
</svg>
